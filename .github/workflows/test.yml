name: Reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --continue

      - name: Show test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          lines = ["| Test | Result |", "| --- | --- |"]
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  failure = tc.find("failure")
                  if failure is None:
                      result = "passed"
                  else:
                      msg = (failure.get("message") or failure.text or "").strip().splitlines()
                      result = "**failed**: " + " / ".join(l.strip() for l in msg[:3])
                  lines.append(f"| `{tc.get('name')}` | {result} |")
          out = "\n".join(lines)
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Test results\n\n" + out + "\n\nThe screenshot (`comparison.png`) is uploaded as an artifact and can be opened directly in the browser.\n")

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Upload without zip so it can be viewed directly in the browser
          archive: false
          path: app/build/outputs/connected_android_test_additional_output/**/comparison.png
